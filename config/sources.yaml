# Verified job sources. Add a company by adding an entry here - no code changes needed.
#
# Supported `ats` values:
#   greenhouse : requires `board`
#   lever      : requires `board` (optional `region: eu` for api.eu.lever.co)
#   ashby      : requires `board`
#   comeet     : requires `uid` and `token` (public Careers API credentials from the company's careers page)
#   aggregator : Jooble Israel API (`JOOBLE_API_KEY` env var); disabled by default
#
# Every entry below was verified live against its official public JSON endpoint.

sources:
  # ------------------------------------------------------------------ Apple & Workday (Israel R&D)
  - name: Apple Israel
    ats: apple
    location: israel-ISR
    queries: [embedded, firmware, real-time, C++, Linux kernel, driver, BSP]

  - name: NVIDIA Israel
    ats: workday
    host: nvidia.wd5.myworkdayjobs.com
    tenant: nvidia
    site: NVIDIAExternalCareerSite
    queries: [embedded Israel, firmware Israel, RTOS Israel, real-time Israel, Linux kernel Israel, driver Israel, Yokneam]

  - name: Intel Israel
    ats: workday
    host: intel.wd1.myworkdayjobs.com
    tenant: intel
    site: External
    queries: [embedded Israel, firmware Israel, RTOS Israel, real-time Israel, Linux kernel Israel]

  - name: Cisco Israel
    ats: workday
    host: cisco.wd5.myworkdayjobs.com
    tenant: cisco
    site: Cisco_Careers
    queries: [embedded Israel, firmware Israel, C++ Israel, Silicon One Israel]

  # ------------------------------------------------------------------ Lever
  - name: Mobileye
    ats: lever
    region: eu
    board: mobileye

  - name: Bright Machines
    ats: lever
