# ---------------------------------------------------------------- location
location:
  # Tiers checked in order; first hit wins. Bonus added to score.
  tiers:
    - name: tel_aviv
      bonus: 15
      places: [tel aviv, herzliya, ramat gan, givatayim, giv'atayim, bnei brak, petah tikva, petah-tikva, holon,
               bat yam, ramat hasharon, ra'anana, kfar saba, kefar sava, hod hasharon, or yehuda,
               airport city, rosh haayin, rosh ha'ayin, kiryat ono, yehud,
               הרצליה, רמת גן, גבעתיים, פתח תקווה, חולון, בת ים, רעננה, כפר סבא,
               הוד השרון, אור יהודה, ראש העין]
    - name: center
      bonus: 8
      places: [netanya, rehovot, rishon lezion, rishon letsiyon, ness ziona, nes ziona, modi'in, lod,
               ramla, yavne, shoham, kfar yona, even yehuda, kadima, be'er ya'akov, beer yaakov,
               נתניה, רחובות, ראשון לציון, נס ציונה, מודיעין, לוד, רמלה, יבנה, שוהם]
    - name: north
      bonus: 7
      places: [haifa, tirat carmel, yokneam, caesarea, hadera, nazareth, migdal haemek, karmiel,
               tefen, matam, kiryat bialik, tel hai, yizre'el, north,
               חיפה, יקנעם, קיסריה, חדרה, נצרת, מגדל העמק, כרמיאל, צפון]
    - name: jerusalem_south
      bonus: 6
      places: [jerusalem, beit shemesh, be'er sheva, omer, sderot, kiryat gat,
               ירושלים, בית שמש, באר שבע]
  # Only send Telegram alerts for matches in these location tiers (all regions still appear in dashboard).
  # Set to [] or omit to send Telegram alerts for all matched regions.
  notify_tiers: [north]
  # Location mentions Israel but no known city -> this bonus (treated like center).
  israel_words: [israel, ישראל]
  israel_generic_bonus: 8
  # Remote jobs are accepted when open to Israel-based people.
  remote_words: [remote, מרחוק]
  remote_ok_regions: [israel, anywhere, worldwide, global, emea]
  remote_bonus: 10
