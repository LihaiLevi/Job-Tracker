# Relevance profile. Everything that decides "is this job for me?" lives here.
# Keywords are matched case-insensitively as whole words/phrases (Hebrew: substring).
# Score = title (capped) + skills (capped) + location bonus - penalties.

thresholds:
  match: 50        # score >= match -> notify
  borderline: 30   # borderline <= score < match -> ask Gemini (only if GEMINI_API_KEY is set)

# ---------------------------------------------------------------- seniority
seniority:
  # Any of these in the TITLE -> reject.
  reject_title_words:
    - intern
    - internship
    - student
    - junior
    - jr
    - graduate
    - entry level
    - entry-level
    - staff
    - principal
    - director
    - manager
    - vp
    - vice president
    - head of
    - chief
    - סטודנט
    - סטודנטית
    - מתמחה
    - ג'וניור
    - מנהל
    - מנהלת
  # Comeet exposes an "experience level" field; reject these values.
  reject_experience_levels: [internship, entry-level, entry level, director, executive]
  senior_title_words: [senior, sr, בכיר, בכירה]
  senior_max_years: 6        # "Senior" accepted only if required years <= this
  reject_min_years: 8        # any posting requiring >= this many years -> reject
  senior_unknown_years_penalty: 5   # "Senior" with no years stated: keep, small penalty

